<head>
    <meta charset="UTF-8">

    <title>Botones Verticales</title>
    <style>
        body {
            display: flex;
            justify-content: center;
           
            height: 100vh;
            background-color: #49b6ff;
        }

        .contenedor {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .boton {
            width: 100px;
            padding: 15px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            background-color: #fffffffd;
            color: rgb(0, 0, 0);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .boton:hover {
            background-color: #ffffff;
        }
    </style>
</head>
