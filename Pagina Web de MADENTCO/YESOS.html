<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materiales Odontológicos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 50px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .item {
            display: inline-block;
            width: 45%;
            margin: 10px;
            padding: 10px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .item img {
            width: 100%;
            max-width: 200px;
            border-radius: 10px;
        }
        .item h3 {
            margin: 10px 0 5px;
        }
        .item p {
            font-size: 18px;
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>YESOS</h1>
        <div class="item">
            <img src="YesoParis.jpg" alt="Producto 1">
            <h3>Yeso Paris</h3>
            <p>75.00 Lps</p>
        </div>
        <div class="item">
            <img src="YesoNictone.jpg" alt="Producto 2">
            <h3>Yeso NicTone Tipo IV</h3>
            <p>120.00 Lps</p>
        </div>
        <div class="item">
            <img src="YesoMagnumAzul.jpg" alt="Producto 3">
            <h3>Yeso Magnum Azul Tipo III</h3>
            <p>120.00 Lps</p>
        </div>
        <div class="item">
            <img src="YesoMagnumAmarillo.jpg" alt="Producto 4">
            <h3>Yeso Magnum Amarillo Tipo III</h3>
            <p>120.00 Lps</p>

        </div>
        
    </div>


</body>
</html>
