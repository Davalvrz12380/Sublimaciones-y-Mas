<html>

    <!DOCTYPE html>
<html lang="es">
<head>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;

        }

            color: #555;
        }
        .contact-form {
            text-align: center;
        }
        input, textarea {

            padding: 10px;
            margin: 10px 0;

        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #218838;
        }
        .map {
            text-align: center;
            margin-top: 20px;
        }
        iframe {

            height: 300px;
            border-radius: 10px;

</head>
