<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materiales Odontológicos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 50px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .item {
            display: inline-block;
            width: 45%;
            margin: 10px;
            padding: 10px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .item img {
            width: 100%;
            max-width: 200px;
            border-radius: 10px;
        }
        .item h3 {
            margin: 10px 0 5px;
        }
        .item p {
            font-size: 18px;
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Materiales DESCARTABLES</h1>
        <div class="item">
            <img src="baberos.jpg" alt="Producto 1">
            <h3>Baberos</h3>
            <p>140.00 Lps</p>
        </div>
        <div class="item">
            <img src="gasas.jpg" alt="Producto 2">
            <h3>Gasas 2x2</h3>
            <p>60.00 Lps</p>
        </div>
        <div class="item">
            <img src="rodetes.png" alt="Producto 3">
            <h3>Rodetes</h3>
            <p>30.50 Lps</p>
        </div>
        <div class="item">
            <img src="esterilizar.jpg" alt="Producto 4">
            <h3>Bolsa para esterilizar</h3>
            <p>350.00 Lps</p>
        </div>
        <div class="item">
            <img src="eyectores.jpg" alt="Producto 5">
            <h3>Eyectores</h3>
            <p>170.00 Lps</p>
        </div>
        <div class="item">
            <img src="agujascortas.jpg" alt="Producto 6">
            <h3>Agujas Cortas</h3>
            <p>165.00 Lps</p>
        </div>
        <div class="item">
            <img src="guanteslatex.jpg" alt="Producto 7">
            <h3>Guantes de Latex</h3>
            <p>130.00 Lps</p>
        </div>
        <div class="item">
            <img src="guantesnitrilo.jpg" alt="Producto 8">
            <h3>Guantes de Nitrilo</h3>
            <p>200.50 Lps</p>
        </div>
        <div class="item">
            <img src="mascarillanegra.jpg" alt="Producto 9">
            <h3>Mascarillas Negras</h3>
            <p>70.00 Lps</p>
        </div>
        <div class="item">
            <img src="puntastriple.jpg" alt="Producto 10">
            <h3>Puntas para Triple</h3>
            <p>50.00 Lps</p>
        </div>
    </div>
</body>
</html>
